<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a30"/>
      <stop offset="100%" stop-color="#1a1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#4d6bfe" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4d6bfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- node graph decoration -->
  <g stroke="#4d6bfe" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <path d="M960,120 C1010,190 1090,170 1120,240"/>
    <path d="M1120,240 C1150,300 1080,360 1120,430"/>
    <path d="M860,430 C920,400 980,440 1030,410"/>
    <path d="M960,120 C900,160 830,150 790,200"/>
    <path d="M790,200 C750,250 800,300 780,350"/>
  </g>
  <g fill="#4d6bfe" fill-opacity="0.75">
    <circle cx="960" cy="120" r="5"/>
    <circle cx="1120" cy="240" r="6"/>
    <circle cx="1120" cy="430" r="5"/>
    <circle cx="790" cy="200" r="5"/>
    <circle cx="780" cy="350" r="6"/>
    <circle cx="1030" cy="410" r="4"/>
  </g>

  <!-- terminal window -->
  <rect x="150" y="150" width="440" height="300" rx="14" fill="#0d1425" stroke="#2a3550" stroke-width="1.5"/>
  <circle cx="182" cy="182" r="6" fill="#ff5f57"/>
  <circle cx="206" cy="182" r="6" fill="#febc2e"/>
  <circle cx="230" cy="182" r="6" fill="#28c840"/>
  <g font-family="Menlo, Consolas, monospace" font-size="21" fill="#9aa7c7">
    <text x="180" y="235"><tspan fill="#4d6bfe">$</tspan> dsh --profile web</text>
    <text x="180" y="278"><tspan fill="#8b5cf6">turn/start</tspan> ── claim inbox</text>
    <text x="180" y="321"><tspan fill="#8b5cf6">step</tspan> ── agent/pre-step</text>
    <text x="180" y="364"><tspan fill="#8b5cf6">tools</tspan> ── pre→execute→post</text>
    <text x="180" y="407"><tspan fill="#28c840">✓</tspan> turn/end · logged</text>
  </g>

  <!-- title -->
  <text x="660" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="700" fill="#f2f5ff" text-anchor="middle">DSH 深度拆解</text>
  <rect x="510" y="302" width="300" height="6" rx="3" fill="url(#accent)"/>
  <text x="660" y="352" font-family="Menlo, Consolas, monospace" font-size="26" fill="#8b95b8" text-anchor="middle">Deep Dive into DeepSeek Harness</text>
  <text x="660" y="414" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#c6cfe8" text-anchor="middle">源码级拆解 · 设计权衡 · 面试冲刺</text>

  <!-- footer tags -->
  <g font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c89ad">
    <rect x="330" y="540" width="150" height="40" rx="20" fill="none" stroke="#3a4768" stroke-width="1.2"/>
    <text x="405" y="566" text-anchor="middle">agent-loop</text>
    <rect x="510" y="540" width="140" height="40" rx="20" fill="none" stroke="#3a4768" stroke-width="1.2"/>
    <text x="580" y="566" text-anchor="middle">compaction</text>
    <rect x="680" y="540" width="150" height="40" rx="20" fill="none" stroke="#3a4768" stroke-width="1.2"/>
    <text x="755" y="566" text-anchor="middle">subagent</text>
    <rect x="860" y="540" width="120" height="40" rx="20" fill="none" stroke="#3a4768" stroke-width="1.2"/>
    <text x="920" y="566" text-anchor="middle">workflow</text>
  </g>
</svg>
